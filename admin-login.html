<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ONYX — Admin Login</title><link rel="stylesheet" href="style.css"></head>
<body>
<div class="shell"><header class="topbar"><a class="brand" href="index.html">ONYX</a><span>ADMIN / LOGIN</span></header>
<main class="content" style="max-width:520px;margin:0 auto;padding-top:80px">
<section class="card">
<h1>Admin Login</h1><p class="muted">Sign in to manage the ONYX databases and tier tests.</p>
<form id="loginForm">
<input id="username" autocomplete="username" placeholder="Username" required>
<input id="password" type="password" autocomplete="current-password" placeholder="Password" required>
<button type="submit">Sign in</button>
<p id="error" class="muted"></p>
</form>
</section>
</main></div>
<script>
loginForm.addEventListener('submit',async e=>{
 e.preventDefault(); error.textContent='Signing in…';
 try{const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'include',body:JSON.stringify({username:username.value,password:password.value})});const d=await r.json();if(!r.ok)throw Error(d.error||'Login failed');location.href='/admin.html';}
 catch(e){error.textContent='❌ '+e.message;password.value='';}
});
</script>
</body></html>
